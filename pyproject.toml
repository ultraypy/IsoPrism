[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isoprism"
version = "0.2.0"
description = "IsoPrism: terminal-aware within-gene isoform allocation from short-read expression"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "IsoPrism developers"}
]
keywords = [
  "single-cell RNA-seq",
  "isoform usage",
  "long-read RNA-seq",
  "spatial transcriptomics",
  "attention"
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "anndata>=0.9",
  "torch>=2.2",
  "matplotlib>=3.6",
  "h5py>=3.8",
  "pyyaml>=6",
  "threadpoolctl>=3"
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.5,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.24"
]
dev = [
  "pytest",
  "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["isoprism*", "short2long*"]

[project.scripts]
isoprism-predict = "isoprism.predict:main"
isoprism-prepare = "isoprism.prepare:main"
isoprism-benchmark = "isoprism.benchmark:main"
isoprism-train = "isoprism.benchmark:train_main"
isoprism-report = "isoprism.report:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/ultraypy/IsoPrism"
Documentation = "https://github.com/ultraypy/IsoPrism/tree/main/docs"
Repository = "https://github.com/ultraypy/IsoPrism"
Issues = "https://github.com/ultraypy/IsoPrism/issues"
